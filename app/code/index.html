<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recquiem</title>
  <link rel="icon" type="image/png" href="app/code/face.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Fixed Side Button -->
  <aside class="side-button-wrapper">
    <a href="Download.html" class="side-button">
      <img src="app/code/Download.png" alt="Download">
      <span>Download RecQuiem</span>
    </a>
  </aside>

  <main>
    <!-- Header / Navbar -->
    <header class="navbar">
      <div class="nav-container">
        <div class="search-bar">
          <input type="text" placeholder="Type something to search games and people." />
        </div>
      </div>
    </header>

    <!-- Main Content Body -->
    <div class="content-wrapper">
      
      <!-- Hero Section -->
      <section class="hero-section">
        <div class="hero-content">
          <img src="app/code/TextIcon.png" alt="Recquiem" class="hero-logo">
          <h1>Join the fun for free!</h1>
          <a href="Download.html" class="btn btn-primary">Download</a>
        </div>
      </section>

      <!-- Feature Grid -->
      <section class="features-grid">
        <div class="feature-card">
          <div class="feature-icon-wrapper">
            <img src="app/code/Cross-Platform.png" alt="Cross-Platform">
          </div>
          <h3>Cross-Platform</h3>
        </div>

        <div class="feature-card">
          <div class="feature-icon-wrapper">
            <img src="app/code/Create.png" alt="Create">
          </div>
          <h3>Create</h3>
        </div>

        <div class="feature-card">
          <div class="feature-icon-wrapper">
            <img src="app/code/Compete.png" alt="Compete">
          </div>
          <h3>Compete</h3>
        </div>

        <div class="feature-card">
          <div class="feature-icon-wrapper">
            <img src="app/code/Cooperate.png" alt="Cooperate">
          </div>
          <h3>Cooperate</h3>
        </div>
      </section>

      <!-- Community Section -->
      <section class="community-section">
        <h2>Join Our Community</h2>
        <div class="community-visual"></div>
        <a href="https://discord.com/invite/wQQJVHW4kr" target="_blank" rel="noopener noreferrer" class="btn btn-discord">
          Join Discord
        </a>
      </section>

    </div>

    <!-- Footer -->
    <footer>
      <div class="footer-rating">
        <img src="app/code/ESRB-Everyone10.png" alt="ESRB Rating: Everyone 10+">
        <span class="rating-descriptors">
          <span>Fantasy Violence</span>
          <span class="divider">|</span>
          <span>Users Interact</span>
        </span>
      </div>

      <div class="footer-links-group">
        <h4>Links</h4>
        <ul>
          <li><a href="https://www.youtube.com/@RecquiemStudios" target="_blank" rel="noopener noreferrer">YouTube</a></li>
          <li><a href="https://www.tiktok.com/@recquieminc" target="_blank" rel="noopener noreferrer">TikTok</a></li>
          <li><a href="https://www.instagram.com/recquiemofficial/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
          <li><a href="https://guns.lol/recquiemstudios" target="_blank" rel="noopener noreferrer">Guns.lol</a></li>
          <li><a href="https://gofund.me/7b7c8670e" target="_blank" rel="noopener noreferrer">GoFundMe</a></li>
        </ul>
      </div>

      <p class="copyright">@2026 RecquiemStudios. All rights reserved.</p>
    </footer>

  </main>

  <!-- Sticky Bottom Download Bar -->
  <a href="Download.html" class="floating-download-btn">
    <img src="app/code/Download.png" alt="Download Icon">
    Download RecQuiem
  </a>

</body>
</html>
